<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#111;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:white;
text-decoration:none;
background:#ff9800;
padding:10px 18px;
border-radius:8px;
}

.container{
width:90%;
max-width:1100px;
margin:30px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:25px;
}

.cart-box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.product{
display:flex;
gap:20px;
align-items:center;
border-bottom:1px solid #ddd;
padding:20px 0;
}

.product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

.info{
flex:1;
}

.info h3{
margin-bottom:8px;
}

.price{
color:#ff5722;
font-size:22px;
font-weight:bold;
}

.qty{
display:flex;
gap:10px;
margin-top:15px;
align-items:center;
}

.qty button{
width:35px;
height:35px;
border:none;
background:#111;
color:white;
border-radius:5px;
cursor:pointer;
font-size:18px;
}

.remove{
margin-top:12px;
color:red;
cursor:pointer;
}

.summary{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
height:fit-content;
}

.summary h2{
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
margin:15px 0;
}

.total{
font-size:25px;
font-weight:bold;
color:#009688;
}

.checkout{
width:100%;
padding:15px;
background:#ff9800;
color:white;
border:none;
font-size:18px;
border-radius:10px;
margin-top:20px;
cursor:pointer;
}

.continue{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#111;
font-weight:bold;
}

@media(max-width:768px){

.container{
grid-template-columns:1fr;
}

.product{
flex-direction:column;
text-align:center;
}

}
</style>

</head>

<body>

<header>

<h1>🛒 My Shopping Cart</h1>

<a href="index.html">Continue Shopping</a>

</header>

<div class="container">

<div class="cart-box">

<div class="product">

<img src="https://via.placeholder.com/120" alt="">

<div class="info">

<h3>Premium Shoes</h3>

<div class="price">₹2,499</div>

<div class="qty">

<button>-</button>

<span>1</span>

<button>+</button>

</div>

<div class="remove">🗑 Remove</div>

</div>

</div>

<div class="product">

<img src="https://via.placeholder.com/120" alt="">

<div class="info">

<h3>Wireless Headphones</h3>

<div class="price">₹1,999</div>

<div class="qty">

<button>-</button>

<span>2</span>

<button>+</button>

</div>

<div class="remove">🗑 Remove</div>

</div>

</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="row">
<span>Subtotal</span>
<span>₹6,497</span>
</div>

<div class="row">
<span>Discount</span>
<span>-₹500</span>
</div>

<div class="row">
<span>Delivery</span>
<span>₹99</span>
</div>

<hr>

<div class="row total">
<span>Total</span>
<span>₹6,096</span>
</div>

<button class="checkout">
Proceed to Checkout
</button>

<a class="continue" href="index.html">
← Continue Shopping
</a>

</div>

</div>

</body>
</html>
